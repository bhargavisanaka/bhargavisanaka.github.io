{{ define "main" }}
<section class="page-container">
  <header class="page-header">
    <h1 class="page-title">{{ .Title }}</h1>
    {{ with .Description }}
      <p class="page-intro">{{ . }}</p>
    {{ end }}
  </header>

  <div class="entry-list">
    {{ range site.Data.updates.items }}
      <article class="entry">
        <p class="entry-meta">{{ .date }}</p>
        <p>{{ .text }}</p>
        {{ with .link }}
          <a href="{{ . }}">Read more →</a>
        {{ end }}
      </article>
    {{ else }}
      <p>New updates will be added soon.</p>
    {{ end }}
  </div>
</section>
{{ end }}
