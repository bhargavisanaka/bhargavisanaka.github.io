
{{ define "main" }}
<article class="page-container">

  <header class="page-header">
    <h1 class="page-title">{{ .Title }}</h1>

    {{ with .Description }}
      <p class="page-intro">{{ . }}</p>
    {{ end }}
  </header>

  <div class="page-content">
    {{ .Content }}
  </div>

</article>
{{ end }}
