{{ define "main" }}
<section class="page-container">
  <div class="research-layout">

    <div class="research-text page-content">
      {{ .Content }}
    </div>

    <aside class="research-figures" aria-label="Research images">
      {{ range site.Data.slideshow.images }}
        <figure class="research-figure">
          <img src="{{ .src }}" alt="{{ .alt | default .caption }}" loading="lazy">
          {{ with .caption }}
            <figcaption>{{ . }}</figcaption>
          {{ end }}
        </figure>
      {{ end }}
    </aside>

  </div>
</section>
{{ end }}
