# Slides shown in the homepage slideshow, in this order.
#
# Image slide:
#   src     = location of the image (static/images/... becomes /images/...)
#   caption = title shown below the image
#   fit     = "contain" shows the whole image; "cover" fills the frame
#
# Video slide (videos play side by side; the slideshow moves on when all have finished):
#   type    = "videos"
#   videos  = list of videos, each with src (static/videos/... becomes /videos/...) and label
#   caption = title shown below the videos

images:
  - src: "/images/research/slide-3.png"
    caption: "Broad applications of lattice structures"
    fit: "contain"

  - src: "/images/research/slide-4.png"
    caption: "Different types of 2D lattices"
    fit: "contain"

  - src: "/images/research/slide-5.png"
    caption: "Applications and types of lattices"
    fit: "contain"

  - type: "videos"
    caption: "Voronoi lattice generation: regularity 0 (highly irregular) and 0.5 (moderately irregular)"
    videos:
      - src: "/videos/00.mp4"
        label: "Regularity 0"
      - src: "/videos/0_5.mp4"
        label: "Regularity 0.5"

  - src: "/images/research/slide-6.png"
    caption: "Specific applications based on required energy absorption"
    fit: "contain"

  - src: "/images/research/slide-7.png"
    caption: "Effect of curvature on lattice geometry"
    fit: "contain"

  - src: "/images/research/slide-1.jpg"
    caption: "Mode shapes of thin plates with stiffeners"
    fit: "contain"

  - src: "/images/research/slide-2.png"
    caption: "Stress concentration due to curvilinear stiffeners"
    fit: "contain"
