# Slides shown in the homepage slideshow, in this order.
#
# Single image:
#   src, caption, fit ("contain" shows the whole image)
#
# Two images side by side:
#   type: "pair", caption, and pictures (each with src and alt)
#
# Videos side by side (moves on when all have finished):
#   type: "videos", caption, and videos (each with src and label)

images:
  - type: "pair"
    caption: "Broad applications of lattice structures (left) and different types of 2D lattices (right)"
    pictures:
      - src: "/images/research/slide-3.png"
        alt: "Broad applications of lattice structures"
      - src: "/images/research/slide-4.png"
        alt: "Different types of 2D lattices"

  - type: "videos"
    caption: "Voronoi lattice generation: regularity 0 (highly irregular) and 0.5 (moderately irregular)"
    videos:
      - src: "/videos/00.mp4"
        label: "Regularity 0"
      - src: "/videos/0_5.mp4"
        label: "Regularity 0.5"

  - type: "pair"
    caption: "Different types of 2D lattices (left) and specific applications based on required energy absorption (right)"
    pictures:
      - src: "/images/research/slide-4.png"
        alt: "Different types of 2D lattices"
      - src: "/images/research/slide-6.png"
        alt: "Specific applications based on required energy absorption"

  - src: "/images/research/slide-7.png"
    caption: "Effect of curvature on lattice geometry"
    fit: "contain"

  - src: "/images/research/slide-1.jpg"
    caption: "Mode shapes of thin plates with stiffeners"
    fit: "contain"

  - src: "/images/research/slide-2.png"
    caption: "Stress concentration due to curvilinear stiffeners"
    fit: "contain"
